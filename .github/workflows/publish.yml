name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore Senviok.sln

    - name: Build solution
      run: dotnet build Senviok.sln --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test tests/Senviok.Tests/Senviok.Tests.csproj --configuration Release --no-build

    - name: Pack NuGet package
      run: dotnet pack src/Senviok/Senviok.csproj --configuration Release --no-build --output ./artifacts

    - name: NuGet login (OIDC Trusted Publishing)
      id: login
      uses: NuGet/login@v1
      continue-on-error: true
      with:
        user: chekwube

    - name: Publish to NuGet
      run: |
        API_KEY="${{ steps.login.outputs.NUGET_API_KEY }}"
        if [ -z "$API_KEY" ]; then
          API_KEY="${{ secrets.NUGET_API_KEY }}"
        fi
        dotnet nuget push ./artifacts/*.nupkg --api-key "$API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

