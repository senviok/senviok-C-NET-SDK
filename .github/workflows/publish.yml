name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore Senviok.sln

    - name: Build solution
      run: dotnet build Senviok.sln --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test tests/Senviok.Tests/Senviok.Tests.csproj --configuration Release --no-build

    - name: Pack NuGet package
      run: dotnet pack src/Senviok/Senviok.csproj --configuration Release --no-build --output ./artifacts

    - name: Publish to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
