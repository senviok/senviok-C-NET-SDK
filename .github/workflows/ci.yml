name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore Senviok.sln

    - name: Build solution
      run: dotnet build Senviok.sln --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test tests/Senviok.Tests/Senviok.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Create NuGet package
      run: dotnet pack src/Senviok/Senviok.csproj --configuration Release --no-build --output ./artifacts
